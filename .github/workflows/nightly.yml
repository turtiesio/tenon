name: nightly
# The evidence loop on GitHub (docs/dev/automation.md): tools/evidence.sh at a
# size that fits about 30 minutes, then one issue per open regression
# (tools/gh.py issues) and STATUS.md as a pull request that merges itself
# when CI passes. Linux only; macOS runs on every push (ci.yml). No secret.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_DIR: ${{ github.workspace }}
      EVIDENCE_LAND: "0"
      TENON_MACHINE: github-ubuntu-latest
      FUZZ_N: "200"
      CHECKFUZZ_N: "300"
      MUTATE_N: "5"
      BENCH_RUNS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      # .evidence/ carries the running totals and the history between nights
      - uses: actions/cache/restore@v4
        with:
          path: .evidence
          key: evidence-${{ github.run_id }}
          restore-keys: evidence-
      # ThreadSanitizer and ASan cannot map their shadow memory with the runner's mmap randomization
      - name: sanitizer-compatible address space
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: tools/evidence.sh
        run: |
          rm -f .evidence/regressions.json  # written again by tools/status.py; never yesterday's
          tools/evidence.sh || echo "::warning::evidence.sh exited with $?"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .evidence
          key: evidence-${{ github.run_id }}
      - name: one issue per open regression
        run: tools/gh.py issues .evidence/regressions.json
      - name: STATUS.md pull request
        run: |
          {
            echo "Generated by the nightly workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from tools/evidence.sh on $(git rev-parse --short HEAD)."
            echo; echo "Last lines of the run:"; echo; echo "~~~"; tail -40 .evidence/last-run.txt; echo "~~~"
          } > "$RUNNER_TEMP/body.md"
          tools/gh.py pr nightly/status "STATUS.md: nightly evidence run $(date +%F)" "$RUNNER_TEMP/body.md" --only STATUS.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: .evidence
          retention-days: 14
