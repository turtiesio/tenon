name: ci
# The gate on Linux and macOS for every push to main and every pull request;
# for pull requests also the approvals guard (docs/dev/automation.md).
# GitHub holds the pull_request run of a pull request opened by the workflows'
# own token until it is approved; ops/repo/gh.py approves it (workflow_dispatch:
# its fallback, and by hand).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The proof gate (ops/gates/formal_check.sh): elan installs the toolchain
      # pinned in formal/lean-toolchain; the toolchain and formal/.lake are cached.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/**/*.lean', 'formal/lakefile.toml') }}
          restore-keys: lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-
      - name: Lean toolchain (formal/lean-toolchain)
        run: |
          [ -x "$HOME/.elan/bin/elan" ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: check --fast
        run: ./check --fast
  trailers:
    # Owner rule (docs/log.md): no AI Co-Authored-By trailers in any commit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no AI co-author trailers
        run: |
          if git log --format='%H%n%B' | grep -iE '^co-authored-by:.*(claude|anthropic|openai|codex|gpt)'; then
            echo "a commit carries an AI Co-Authored-By trailer"; exit 1
          fi
  approvals:
    # A pull request is unattended work: ops/repo/approvals.py --pr, run as the
    # base has it (the branch's copy could be changed), refuses approval lines,
    # removed guard rules, owner paths and frozen-seed changes.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ops/repo/approvals.py --pr (the base's)
        run: |
          git fetch -q origin main
          base=$(git merge-base origin/main HEAD)
          git show "$base:ops/repo/approvals.py" > .git/approvals_base.py
          python3 .git/approvals_base.py --pr "$base"
